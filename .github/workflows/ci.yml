name: netjsongraph.js CI BUILD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qa-checks:
    name: QA checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7

      - name: Install dependencies
        run: |
          yarn install
          python --version
          pip install --upgrade "openwisp-utils[qa]~=1.3.0"
          sudo npm install -g prettier

      - name: QA checks
        run: ./run-qa-checks

  build:
    name: Tests and coverage (${{ matrix.build-type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [dev, prod, echarts-only]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install

      - name: Build (Prod Full)
        if: matrix.build-type == 'prod'
        run: yarn build:full

      - name: Build (Echarts Only)
        if: matrix.build-type == 'echarts-only'
        run: yarn build:echarts-only

      - name: Run server (Dev)
        if: matrix.build-type == 'dev'
        run: yarn dev:test &

      - name: Run server (Dist)
        if: matrix.build-type == 'prod' || matrix.build-type == 'echarts-only'
        run: npx --yes http-server dist -p 8080 &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:8080

      - name: Set up Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Check chrome and chromedriver version
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          "$CHROME_PATH" --version
          "$CHROMEDRIVER_PATH" --version

      - name: Unit tests
        if: matrix.build-type == 'dev'
        run: yarn coverage --testPathIgnorePatterns=test/netjsongraph.browser.test.js

      - name: Browser tests
        env:
          SE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          SE_CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: yarn test --runInBand --testTimeout=30000 test/netjsongraph.browser.test.js

      - name: Coveralls
        if: matrix.build-type == 'dev'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-and-deploy:
    name: Build and deploy GitHub Pages
    if: github.repository == 'openwisp/netjsongraph.js' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: write # Pushes generated files to the legacy gh-pages branch.
    concurrency:
      group: github-pages-${{ github.repository }}
      cancel-in-progress: false
    env:
      MAPBOX_URL_TEMPLATE: ${{ secrets.MAPBOX_URL_TEMPLATE }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
