name: netjsongraph.js CI BUILD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  qa-checks:
    name: QA-Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - name: Cache yarn
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Installing dependencies
        run: |
          yarn install
          python --version
          pip install --upgrade "openwisp-utils[qa]~=1.3.0"
          sudo npm install -g prettier

      - name: QA checks
        run: ./run-qa-checks

  build:
    name: Tests and Coverage (${{ matrix.build-type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [dev, prod, echarts-only]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - name: Cache yarn
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Installing dependencies
        run: |
          yarn install

      - name: Build (Prod Full)
        if: matrix.build-type == 'prod'
        run: yarn build:full

      - name: Build (Echarts Only)
        if: matrix.build-type == 'echarts-only'
        run: yarn build:echarts-only

      - name: Running Server (Dev)
        if: matrix.build-type == 'dev'
        run: yarn dev:test &

      - name: Running Server (Dist)
        if: matrix.build-type == 'prod' || matrix.build-type == 'echarts-only'
        run: npx --yes http-server dist -p 8080 &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:8080

      - name: Set up Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Check chrome and chromedriver version
        run: |
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version
          "${{ steps.setup-chrome.outputs.chromedriver-path }}" --version

      - name: Unit tests
        if: matrix.build-type == 'dev'
        run: yarn coverage --testPathIgnorePatterns=test/netjsongraph.browser.test.js

      - name: Browser tests
        # Test timeout set to 30 seconds in CI since it runs slower
        env:
          SE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          SE_CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: yarn test --runInBand --testTimeout=30000 test/netjsongraph.browser.test.js

      - name: Coveralls
        if: matrix.build-type == 'dev'
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name=='push' }}
    env:
      MAPBOX_URL_TEMPLATE: ${{ secrets.MAPBOX_URL_TEMPLATE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installing dependencies
        run: |
          yarn install

      - name: Build
        run: yarn build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
