<!doctype html>
<html lang="en">
  <head>
    <title>GeoJSON Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css"
      integrity="sha512-hoalWLoI8r4UszCkZ5kL8vayOGVae1oxXe/2A4AO6J9+580uKHDO3JdHb7NzwwzK5xr/Fs0W40kiNHxM9vyTtQ=="
      crossorigin=""
    />
    <!-- theme can be easily customized via css -->
    <link href="../lib/css/netjsongraph-theme.css" rel="stylesheet" />
    <link href="../lib/css/netjsongraph.css" rel="stylesheet" />
  </head>
  <body>
    <script type="text/javascript">
      const map = new NetJSONGraph("../assets/data/geojson-sample.json", {
        render: "map",
        // polygons are clustered together with points
        clustering: true,
        clusteringThreshold: 0,
        disableClusteringAtLevel: 6,
        // clicking a point or a polygon adds it to the URL
        bookmarkableActions: {
          enabled: true,
          id: "geoJson",
        },
        // set map initial state.
        mapOptions: {
          center: [46.86764405052012, 19.675998687744144],
          zoom: 5,
          nodePopup: {
            show: true,
            config: {
              closeOnClick: false,
            },
          },
        },
      });

      map.render();
      window.map = map;
    </script>
  </body>
</html>
