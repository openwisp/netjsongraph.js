<!doctype html>
<html lang="en">
  <head>
    <title>netjsongraph.js: Search elements</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <!-- theme can be easily customized via css -->
    <link href="../lib/css/netjsongraph-theme.css" rel="stylesheet" />
    <link href="../lib/css/netjsongraph.css" rel="stylesheet" />
    <style>
      .njg-container .njg-searchContainer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px;
        left: 0;
        right: 0;
        width: min(500px, calc(100% - 24px));
        margin: 0 auto;
      }

      .njg-container .njg-searchInput {
        width: 100%;
        height: auto;
      }

      .njg-container .njg-searchInput,
      .njg-container .njg-searchBtn {
        margin: 0;
        padding: 8px 10px;
        border: 1px solid #767676;
        border-radius: 5px;
      }

      .njg-container .njg-searchContainer :focus-visible {
        outline: 2px solid #2256a1;
        outline-offset: 2px;
      }

      #search-hint {
        grid-column: 1 / -1;
        justify-self: center;
        background: white;
        padding: 2px 4px;
      }

      @media (max-width: 620px) {
        .njg-container .njg-searchContainer {
          top: 60px;
        }
      }
    </style>
  </head>

  <body>
    <template id="search-controls">
      <form class="njg-searchContainer" role="search">
        <input
          class="njg-searchInput"
          type="search"
          aria-label="Search sample data"
          aria-describedby="search-hint"
          pattern="\s*(test|appendData)\s*"
          title="Enter test or appendData"
          required
        />
        <button class="njg-searchBtn" type="submit">Search</button>
        <small id="search-hint">
          Enter <code>test</code> to replace the graph or
          <code>appendData</code> to add to it.
        </small>
      </form>
    </template>
    <script type="text/javascript">
      const form =
        document.getElementById("search-controls").content.firstElementChild;
      const input = form.querySelector("input");
      const graph = new NetJSONGraph("../assets/data/netjsonmap.json", {
        onReady: function () {
          // Serve sample responses alongside the static demo.
          const search = this.utils.searchElements.call(
            this,
            "../assets/data/netjsonAppendData/",
          );
          form.addEventListener("submit", (event) => {
            event.preventDefault();
            const append = input.value.trim() === "appendData";
            search(append ? "2.json" : "1.json", !append);
          });
          this.el.appendChild(form);
        },
      });

      graph.render();
    </script>
  </body>
</html>
