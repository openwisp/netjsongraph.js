<!doctype html>
<html lang="en">
  <head>
    <title>GeoJSON Polygon Clustering Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css"
      integrity="sha512-hoalWLoI8r4UszCkZ5kL8vayOGVae1oxXe/2A4AO6J9+580uKHDO3JdHb7NzwwzK5xr/Fs0W40kiNHxM9vyTtQ=="
      crossorigin=""
    />
    <!-- theme can be easily customized via css -->
    <link href="../lib/css/netjsongraph-theme.css" rel="stylesheet" />
    <link href="../lib/css/netjsongraph.css" rel="stylesheet" />
    <style type="text/css">
      #info {
        position: absolute;
        left: 25px;
        bottom: 25px;
        max-width: 340px;
        padding: 8px 15px;
        background: #fbfbfb;
        border-radius: 8px;
        color: #000;
        font-family: Arial, sans-serif;
        font-size: 13px;
        z-index: 1000;
      }
      #info h4 {
        margin: 8px 0;
      }
      #info ol {
        margin: 0;
        padding-left: 18px;
      }
      .njg-container .njg-sideBar {
        display: none;
      }
      .njg-container .leaflet-popup-tip-container {
        bottom: -3.5%;
      }
      .njg-container .leaflet-popup-tip {
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <script type="text/javascript">
      const map = new NetJSONGraph(
        "../assets/data/geojson-polygon-clustering.json",
        {
          render: "map",
          clustering: true,
          clusteringThreshold: 2,
          clusterRadius: 80,
          disableClusteringAtLevel: 7,
          bookmarkableActions: {
            enabled: true,
            id: "polygonClustering",
          },
          mapOptions: {
            center: [46.86764405052012, 19.675998687744144],
            zoom: 5,
            minZoom: 3,
            maxZoom: 18,
            nodePopup: {
              show: true,
              config: {
                closeOnClick: false,
                autoPan: true,
                autoPanPadding: [25, 25],
                offset: [-8, -8],
              },
            },
          },
          // This example uses popups instead of the default sidebar.
          onClickElement: () => {},
          onReady() {
            const update = () => {
              zoom.textContent = this.leaflet.getZoom();
            };
            this.leaflet.on("zoomend", update);
            update();
          },
        },
      );
      // The info box is added after rendering, which replaces the body contents
      const info = document.createElement("div");
      info.setAttribute("id", "info");
      info.innerHTML = `
        <h4>Polygons in clusters</h4>
        <ol>
          <li>Zoom out: polygons are hidden inside the clusters.</li>
          <li>Zoom in to level 7: clusters split and polygons come back.</li>
          <li>Click a polygon: the popup opens and the URL is updated.</li>
          <li>Reload the page: the same polygon is selected again.</li>
        </ol>
        <p>
          Click a polygon to see which case it covers: concave shape, hole,
          MultiPolygon, missing id, id 0, HTML in the id, shared position with
          a point, degenerate shape, isolated polygon.
        </p>
        <p>Current zoom: <strong></strong></p>`;
      const zoom = info.querySelector("strong");
      map.render();
      document.body.appendChild(info);
      // Required for selenium tests
      window.map = map;
    </script>
  </body>
</html>
