<!doctype html>
<html>
  <head>
    <title>netjsongraph.js: Leaflet plugins</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css"
      integrity="sha512-hoalWLoI8r4UszCkZ5kL8vayOGVae1oxXe/2A4AO6J9+580uKHDO3JdHb7NzwwzK5xr/Fs0W40kiNHxM9vyTtQ=="
      crossorigin=""
    />
    <link href="../lib/css/leaflet-draw.css" rel="stylesheet" />
    <link href="../lib/css/leaflet-measure.css" rel="stylesheet" />
    <!-- theme can be easily customized via css -->
    <link href="../lib/css/netjsongraph-theme.css" rel="stylesheet" />
    <link href="../lib/css/netjsongraph.css" rel="stylesheet" />
    <style type="text/css">
      .njg-container .leaflet-control-measure {
        margin-top: 0 !important;
      }
      .njg-container .leaflet-measure-resultpopup .leaflet-popup-tip-container {
        bottom: -3.5%;
      }
      .njg-container .leaflet-measure-resultpopup .leaflet-popup-tip {
        box-shadow: none;
      }
      .njg-container .leaflet-measure-resultpopup .leaflet-popup-content {
        box-sizing: border-box;
        padding: 8px 10px;
      }
      .njg-container .leaflet-measure-resultpopup p {
        overflow-wrap: anywhere;
      }
      .njg-container .leaflet-measure-resultpopup .tasks {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 8px 12px;
      }
      .njg-container .leaflet-measure-resultpopup .tasks li {
        display: block;
        margin: 0;
      }
      .njg-container .leaflet-measure-resultpopup .tasks a.zoomto,
      .njg-container .leaflet-measure-resultpopup .tasks a.deletemarkup {
        display: inline-flex;
        align-items: center;
        min-height: 16px;
      }
      .njg-container .leaflet-measure-resultpopup .tasks a.deletemarkup {
        color: #c62828;
        background-image: none;
        position: relative;
      }
      .njg-container
        .leaflet-measure-resultpopup
        .tasks
        a.deletemarkup::before {
        position: absolute;
        top: 50%;
        left: 0;
        width: 12px;
        height: 12px;
        background-color: currentColor;
        content: "";
        transform: translateY(-50%);
        -webkit-mask: url("../lib/css/assets/trash.png") center / contain
          no-repeat;
        mask: url("../lib/css/assets/trash.png") center / contain no-repeat;
      }
    </style>
  </head>

  <body>
    <script type="text/javascript" src="../lib/js/leaflet-draw.js"></script>
    <script type="text/javascript" src="../lib/js/leaflet-measure.js"></script>
    <script type="module">
      /*
        The demo is used to show how to use the leaflet plugins.
        Mainly the operation of leaflet.
        See below for details.
      */
      const graph = new NetJSONGraph("../assets/data/netjsonmap.json", {
        render: "map",
        // set map initial state.
        mapOptions: {
          center: [46.86764405052012, 19.675998687744144],
          zoom: 6,
          nodeConfig: {
            label: {
              color: "#000",
              offset: [0, -10],
            },
          },
        },
        // Convert to internal json format
        prepareData: (data) => {
          data.nodes.map((node) => {
            node.label = node.name;
            node.properties = Object.assign(node.properties || {}, {
              location: node.location,
            });
          });
        },
        // Load related plugins after the map is rendered
        onReady: function () {
          /* 
            The map has this property only after the map is rendered,
            so we have to put the relevant function in `onLoad` life cycle
          */
          let map = this.leaflet,
            editableLayers = new L.FeatureGroup(),
            // Plugin related configuration
            MyCustomMarker = L.Icon.extend({
              options: {
                shadowUrl: null,
                iconAnchor: new L.Point(12, 12),
                iconUrl: "../../lib/css/images/marker-icon.png",
              },
            }),
            options = {
              position: "bottomright",
              draw: {
                polyline: {
                  shapeOptions: {
                    color: "#f357a1",
                    weight: 3,
                  },
                },
                polygon: {
                  allowIntersection: false, // Restricts shapes to simple polygons
                  drawError: {
                    color: "#e1e100", // Color the shape will turn when intersects
                    message: "<strong>Oh snap!<strong> you can't draw that!", // Message that will show when intersect
                  },
                  shapeOptions: {
                    color: "#bada55",
                  },
                },
                circle: true, // Turns off this drawing tool
                rectangle: {
                  shapeOptions: {
                    clickable: false,
                  },
                },
                marker: {
                  icon: new MyCustomMarker(),
                },
              },
              edit: {
                featureGroup: editableLayers, // REQUIRED!!
                remove: true,
              },
            };
          map.addLayer(editableLayers);
          map.addControl(new L.Control.Draw(options));
          map.on(L.Draw.Event.CREATED, function (e) {
            var type = e.layerType,
              layer = e.layer;
            if (type === "marker") {
              layer.bindPopup("A popup!");
            }

            editableLayers.addLayer(layer);
          });
          L.control
            .measure({
              popupOptions: {
                className: "leaflet-measure-resultpopup",
                closeOnClick: false,
                autoPan: true,
                autoPanPadding: [25, 25],
                offset: [-8, -8],
                maxWidth: 320,
              },
              position: "bottomleft",
            })
            .addTo(map);
        },
      });
      graph.render();
    </script>
  </body>
</html>
