<!doctype html><html><head><title>netjsongraph.js: Leaflet plugins</title><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css" integrity="sha512-hoalWLoI8r4UszCkZ5kL8vayOGVae1oxXe/2A4AO6J9+580uKHDO3JdHb7NzwwzK5xr/Fs0W40kiNHxM9vyTtQ==" crossorigin=""/><link href="../lib/css/leaflet-draw.css" rel="stylesheet"/><link href="../lib/css/leaflet-measure.css" rel="stylesheet"/><link href="../lib/css/netjsongraph-theme.css" rel="stylesheet"/><link href="../lib/css/netjsongraph.css" rel="stylesheet"/><style>.njg-container .leaflet-draw-toolbar-top {

        mask: url("../lib/css/assets/trash.png") center / contain no-repeat;
      }</style><script src="../netjsongraph.min.js"></script></head><body><script src="../lib/js/leaflet-draw.js"></script><script src="../lib/js/leaflet-measure.js"></script><script type="module">/*
        The demo is used to show how to use the leaflet plugins.
        Mainly the operation of leaflet.
        See below for details.
      */
      const graph = new NetJSONGraph("../assets/data/netjsonmap.json", {
        render: "map",
        // set map initial state.
        mapOptions: {
          center: [46.86764405052012, 19.675998687744144],
          zoom: 6,
          nodeConfig: {
            label: {
              color: "#000",
              offset: [0, -10],
            },
          },
        },
        // Convert to internal json format
        prepareData: (data) => {
          data.nodes.map((node) => {
            node.label = node.name;
            node.properties = Object.assign(node.properties || {}, {
              location: node.location,
            });
          });
        },
        // Load related plugins after the map is rendered
        onReady: function () {
          /* 
            The map has this property only after the map is rendered,
            so we have to put the relevant function in `onLoad` life cycle
          */
          let map = this.leaflet,
            editableLayers = new L.FeatureGroup(),
            measurementColor = "#f57c00",
            // Plugin related configuration
            MyCustomMarker = L.Icon.extend({
              options: {
                shadowUrl: null,
                iconAnchor: new L.Point(12, 12),
                iconUrl: "../../lib/css/images/marker-icon.png",
              },
            }),
            options = {
              position: "bottomright",
              draw: {
                polyline: {
                  shapeOptions: {
                    color: measurementColor,
                    weight: 3,
                  },
                },
                polygon: {
                  allowIntersection: false, // Restricts shapes to simple polygons
                  drawError: {
                    color: "#e1e100", // Color the shape will turn when intersects
                    message: "<strong>Oh snap!<strong> you can't draw that!", // Message that will show when intersect
                  },
                  shapeOptions: {
                    color: measurementColor,
                  },
                },
                circle: {
                  shapeOptions: {
                    color: measurementColor,
                  },
                },
                circlemarker: {
                  shapeOptions: {
                    color: measurementColor,
                  },
                },
                rectangle: {
                  shapeOptions: {
                    color: measurementColor,
                    clickable: false,
                  },
                },
                marker: {
                  icon: new MyCustomMarker(),
                },
              },
              edit: {
                featureGroup: editableLayers, // REQUIRED!!
                remove: true,
              },
            };
          map.addLayer(editableLayers);
          map.addControl(new L.Control.Draw(options));
          map.on(L.Draw.Event.CREATED, function (e) {
            var type = e.layerType,
              layer = e.layer;
            if (type === "marker") {
              layer.bindPopup("A popup!");
            }

            editableLayers.addLayer(layer);
          });
          map.on("measurestart", () => map.closePopup());
          L.control
            .measure({
              activeColor: measurementColor,
              completedColor: measurementColor,
              popupOptions: {
                className: "leaflet-measure-resultpopup",
                autoPan: true,
                autoPanPadding: [25, 25],
                maxWidth: 320,
              },
              position: "bottomleft",
            })
            .addTo(map);
        },
      });
      graph.render();
      // required for selenium browser tests
      window.map = graph;</script></body></html>
